name: Verify ScreenStream Unified

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Toolchain
        run: |
          java -version
          gradle --version

      - name: Clean
        run: gradle --no-daemon clean --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace --warning-mode all

      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenstream-unified-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screenstream-unified-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
